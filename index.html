<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Мои ссылки</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      background: #0b0b0f;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      text-align: center;
      background: #15151b;
      border: 1px solid #303039;
      border-radius: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: #aaaab6; }
    .links { display: grid; gap: 12px; }
    a {
      display: block;
      padding: 15px 18px;
      border: 1px solid #41414d;
      border-radius: 12px;
      color: #fff;
      background: #202027;
      text-decoration: none;
      font-weight: 700;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    a:hover, a:focus-visible {
      transform: translateY(-2px);
      border-color: #ff334f;
      background: #292029;
      outline: none;
    }
    .note { margin-top: 18px; font-size: 12px; color: #777783; }
  </style>
</head>
<body>
  <main>
    <h1>Мои ссылки</h1>
    <p>Все нужные страницы в одном месте</p>
    <nav class="links" aria-label="Мои ссылки">

      <a href="https://t.me/starscold_bot" target="_blank" rel="noopener noreferrer">Лучший шоп звёзд</a>

      <a href="https://discord.com/" target="_blank" rel="noopener noreferrer">Мой Discord — pandemia707</a>
    </nav>
    <div class="note">Discord откроет приложение или сайт. Для прямой ссылки на профиль нужен Discord User ID.</div>
  </main>
</body>
</html>
