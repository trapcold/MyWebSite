<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>


<!-- ENTER -->

<div class="enter" id="enter">

    <button class="enter-btn" onclick="openSite()">

</div>




<!-- BLOOD EFFECT -->

<div class="wrap">


    <div class="card">



        <!-- AVATAR -->

        <div class="avatar-box">

            <img

            class="avatar"
            alt="pandemia avatar">

        </div>





        <!-- NAME -->

        <h1 class="nick">
            pandemia
        </h1>



        <p class="sub">
            I wish you all good luck
        </p>






        <!-- BUTTONS -->

        <div class="links">


            <a 
            class="btn"
            href="https://t.me/coId_1337"
            target="_blank">

                TELEGRAM

            </a>



            <a 
            class="btn"
            href="https://discord.com/"
            target="_blank">

                DISCORD

            </a>



            <a 
            class="btn"
            href="https://t.me/starscold_bot"
            target="_blank">

                ⭐ ДЕШЁВЫЕ ЗВЁЗДЫ

            </a>



            <a 
            class="btn"
            href="#">

                🛡 ЛУЧШИЙ VPN

            </a>



            <button 
            class="btn"
            id="likeBtn">

                ❤️ ЛАЙК

            </button>



        </div>







        <!-- STATS -->


        <div class="stats">


            <div class="stat">

                👁

                <span id="views">
                    0

            </div>



            <div class="stat">

                ❤️

                <span id="likes">
                    0
                </span>

            </div>



        </div>







        <!-- QUOTE -->


        <div class="quote">

            «Полюби безразличие, и оно исцелит твои раны,
            <br>
            даруя свободу от страданий.»

        </div>






        <!-- FOOTER -->


        <div class="footer-text">

            все права защищены pandemia ⛧

        </div>




    </div>


</div>







<!-- MUSIC -->

<audio 
id="music"
src="music.mp3"
loop>

</audio>






<script src="script.js"></script>

</html>
